name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gamebot
          POSTGRES_USER: gamebot
          POSTGRES_PASSWORD: gamebot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gamebot" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://gamebot:gamebot@localhost:5432/gamebot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      # تطابق منطق قطعی بازی‌های آرکید بین core.js و شبیه‌ساز پایتون
      - run: node arcade/jstests/parity.js
      - run: pytest
