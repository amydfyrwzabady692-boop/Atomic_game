{% load static %}<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<title>پوکر</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🃏%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{% static 'arcade/board/chess.css' %}?v={{ version }}">
<link rel="stylesheet" href="{% static 'arcade/board/poker.css' %}?v={{ version }}">
<link rel="preload" href="/arcade/font/regular.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body class="poker">
<main id="game" class="hidden">
  <header id="table-head">
    <div class="title">
      <b>🃏 پوکر</b>
      <span class="chip" id="hand-chip"></span>
      <span class="chip blinds" id="blind-chip"></span>
    </div>
    <div class="tools">
      <button class="icon-btn" id="sound-btn" type="button" aria-label="صدا" title="صدا">🔊</button>
      <button class="icon-btn" id="resign-btn" type="button" aria-label="ترک میز" title="ترک میز">🚪</button>
    </div>
  </header>

  <section id="table" aria-label="میز پوکر">
    <div id="felt">
      <div class="felt-logo">WINZON</div>
      <div id="center">
        <div id="pot"><i class="chip-ico"></i><span>پات</span> <b id="pot-amount">۰</b></div>
        <div id="board-cards"></div>
        <div id="street"></div>
      </div>
    </div>
    <div id="layer"></div>
  </section>

  <section id="me" class="hidden">
    <div id="my-cards"></div>
    <div class="hero">
      <div class="ava" id="my-ava"><span id="my-initial"></span></div>
      <div class="meta"><b id="my-name"></b><small id="my-chips"></small></div>
      <span class="hero-bet hidden" id="my-bet"></span>
    </div>
    <div id="my-hand"></div>
  </section>

  <div id="log" aria-live="polite"></div>

  <p id="status" aria-live="polite"></p>

  <section id="controls" class="hidden">
    <div id="sizing" class="hidden">
      <div class="presets" id="presets"></div>
      <div class="slider">
        <button class="icon-btn" id="minus-btn" type="button" aria-label="کمتر">−</button>
        <input id="raise-range" type="range" min="0" max="0" step="1" aria-label="مقدار رِیز">
        <button class="icon-btn" id="plus-btn" type="button" aria-label="بیشتر">+</button>
      </div>
    </div>
    <div class="row main">
      <button id="fold-btn" class="btn danger" type="button">فولد</button>
      <button id="check-btn" class="btn go" type="button">چک</button>
      <button id="call-btn" class="btn go" type="button">کال</button>
      <button id="raise-btn" class="btn violet" type="button">رِیز</button>
      <button id="allin-btn" class="btn gold" type="button">آل‌این</button>
    </div>
  </section>
</main>

<section id="loading" class="overlay">
  <div class="spinner"></div>
  <p id="loading-text">در حال آماده‌سازی میز پوکر…</p>
</section>

<section id="result" class="overlay hidden">
  <div class="card">
    <div class="result-icon" id="result-icon">🏆</div>
    <h1 id="result-title"></h1>
    <p class="muted" id="result-reason"></p>
    <ol id="result-list"></ol>
    <button id="result-close" class="btn go" type="button">برگشت</button>
    <button id="result-view" class="btn violet" type="button">دیدن میز</button>
  </div>
</section>
<div id="confetti" aria-hidden="true"></div>

<div id="toast" class="hidden" role="alert"></div>

<script src="{% static 'arcade/common/telegram-web-app.js' %}?v={{ version }}"></script>
<script src="{% static 'arcade/common/sfx.js' %}?v={{ version }}"></script>
<script>
window.BOARD_BOOT = {
  token: "{{ token|escapejs }}",
  apiBase: "{% url 'arcade:app' %}api/",
  devAuth: {{ dev_auth|yesno:"true,false" }},
  version: "{{ version }}"
};
</script>
<script src="{% static 'arcade/board/poker.js' %}?v={{ version }}"></script>
</body>
</html>
