{% load static %}<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141a2e">
<title>شطرنج</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E♟%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{% static 'arcade/board/chess.css' %}?v={{ version }}">
<link rel="preload" href="/arcade/font/regular.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body class="chess">
<main id="game" class="hidden">
  <header id="topbar">
    <button class="icon-btn" id="flip-btn" type="button" aria-label="چرخاندن صفحه" title="چرخاندن صفحه">⇅</button>
    <div class="title">
      <b id="title">شطرنج</b>
      <span class="chip hidden" id="control-chip"></span>
    </div>
    <div class="tools">
      <button class="icon-btn" id="theme-btn" type="button" aria-label="رنگ صفحه" title="رنگ صفحه">🎨</button>
      <button class="icon-btn" id="sound-btn" type="button" aria-label="صدا" title="صدا">🔊</button>
    </div>
  </header>

  <section class="player" id="bar-top">
    <span class="avatar" id="top-avatar"></span>
    <div class="who"><b id="top-name"></b><div class="taken" id="top-taken"></div></div>
    <div class="clock" id="top-clock"><span class="clock-text"></span></div>
  </section>

  <div id="board-wrap">
    <div id="board" role="grid" aria-label="صفحه‌ی شطرنج"></div>
    <svg id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
    <div id="promo" class="hidden" role="dialog" aria-label="انتخاب مهره برای ارتقا"></div>
  </div>

  <section class="player" id="bar-bottom">
    <span class="avatar" id="bottom-avatar"></span>
    <div class="who"><b id="bottom-name"></b><div class="taken" id="bottom-taken"></div></div>
    <div class="clock" id="bottom-clock"><span class="clock-text"></span></div>
  </section>

  <div id="moves" aria-label="حرکت‌ها"><span class="empty">حرکت‌ها این‌جا نوشته می‌شوند</span></div>

  <p id="status" aria-live="polite"></p>
  <div id="review-bar" class="hidden"><span id="review-text"></span><button type="button" id="live-btn">برگشت به بازی ⏭</button></div>

  <nav id="toolbar" aria-label="ابزار بازی">
    <div class="nav-group" dir="ltr">
      <button class="tool" type="button" id="first-btn" aria-label="اولین حرکت"><b>⏮</b><small>اول</small></button>
      <button class="tool" type="button" id="prev-btn" aria-label="حرکت قبلی"><b>◀</b><small>قبلی</small></button>
      <button class="tool" type="button" id="next-btn" aria-label="حرکت بعدی"><b>▶</b><small>بعدی</small></button>
      <button class="tool" type="button" id="last-btn" aria-label="آخرین حرکت"><b>⏭</b><small>آخر</small></button>
    </div>
    <div class="nav-group" id="actions">
      <button class="tool hidden" type="button" id="hint-btn"><b>💡</b><small>راهنما</small></button>
      <button class="tool hidden" type="button" id="undo-btn"><b>↩️</b><small>برگشت</small></button>
      <button class="tool" type="button" id="draw-btn"><b>🤝</b><small>مساوی</small></button>
      <button class="tool danger" type="button" id="resign-btn"><b>🏳</b><small>تسلیم</small></button>
    </div>
  </nav>
</main>

<div id="offline" class="hidden" role="status">📡 اتصال ضعیف است؛ در حال تلاش دوباره…</div>

<img id="ghost" class="hidden" alt="" draggable="false">

<section id="loading" class="overlay">
  <div class="spinner"></div>
  <p id="loading-text">در حال آماده‌سازی صفحه‌ی شطرنج…</p>
</section>

<section id="levels" class="overlay hidden">
  <div class="card">
    <div class="result-icon"><img class="knight" src="{{ piece_base }}wn.png" alt="" width="84" height="84"></div>
    <h1>شطرنج با کامپیوتر</h1>
    <p class="muted">سطح حریف را انتخاب کن. رنگ مهره‌ها تصادفی است.</p>
    <button class="btn go" type="button" data-level="easy">آسان</button>
    <button class="btn violet" type="button" data-level="medium">متوسط</button>
    <button class="btn danger" type="button" data-level="hard">سخت</button>
    <a class="btn ghost-link" id="menu-link" href="{{ menu_url }}">‹ بازی‌های دیگر</a>
  </div>
</section>

<section id="result" class="overlay hidden">
  <div class="card">
    <div class="result-icon" id="result-icon">🏆</div>
    <h1 id="result-title"></h1>
    <p class="muted" id="result-reason"></p>
    <p class="result-clocks hidden" id="result-clocks"></p>
    <button id="result-close" class="btn go" type="button">برگشت به گروه</button>
    <button id="result-view" class="btn violet" type="button">دیدن صفحه</button>
  </div>
</section>
<div id="confetti" aria-hidden="true"></div>

<div id="toast" class="hidden" role="alert"></div>

<script src="{% static 'arcade/common/telegram-web-app.js' %}?v={{ version }}"></script>
<script src="{% static 'arcade/common/sfx.js' %}?v={{ version }}"></script>
<script>
window.BOARD_BOOT = {
  token: "{{ token|escapejs }}",
  practice: {{ practice|yesno:"true,false" }},
  apiBase: "{% url 'arcade:app' %}api/",
  pieceBase: "{{ piece_base|escapejs }}",
  devAuth: {{ dev_auth|yesno:"true,false" }},
  version: "{{ version }}"
};
</script>
<script src="{% static 'arcade/board/chess.js' %}?v={{ version }}"></script>
</body>
</html>
